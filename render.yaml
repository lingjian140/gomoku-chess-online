services:
  - type: web
    name: gomoku-chess-online
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install
    startCommand: npm start
    envVars:
      # 云数据库连接串（Neon / Supabase / Render PG 均可），不配置则账号会在每次部署后丢失
      - key: DATABASE_URL
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: NODE_VERSION
        value: 20.11.0
      # 邮箱验证码（可选，用于找回密码；不配置时验证码打印到服务端控制台）
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        sync: false
